name: kernel

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: bench budget
        run: npx tsx scripts/bench-3d.mjs --out bench-3d.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-3d
          path: bench-3d.json
          if-no-files-found: ignore

  addon:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: load the platform addon
        shell: bash
        run: node scripts/addon-hash.mjs
