name: kernel

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Both Linux jobs build the renderer from source and drop the addon in place
  # before anything loads it. The binaries committed under native/ are a
  # release artifact for macOS and Windows, where no runner here builds them;
  # on Linux the current renderer source is what the tests must exercise, not
  # a binary someone committed weeks ago.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # flexlayer-render is private, so this repository's default GITHUB_TOKEN
      # cannot read it. RENDER_REPO_TOKEN is a fine-grained PAT with read access
      # to that repository only. Without the secret the job fails at checkout,
      # which is the intent: a green job that tested a stale committed binary
      # would verify nothing.
      #
      # RENDER_REF pins the renderer. A paired quality branch on the renderer
      # is used when it exists; otherwise main. A release pull request is the
      # exception: its head branch exists only here, so that name never exists
      # on the renderer. Those runs pin the commit `BUILD.json` recorded, which
      # is the exact tree the addons were built from.
      - name: resolve the renderer ref
        id: render-ref
        shell: bash
        env:
          RENDER_REF: ${{ vars.RENDER_REF }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/renderer-ref.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ruochi/flexlayer-render
          ref: ${{ steps.render-ref.outputs.ref }}
          token: ${{ secrets.RENDER_REPO_TOKEN }}
          path: vendor/flexlayer-render
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@1.88.0
      # skia-bindings links -lfreetype -lfontconfig; ubuntu-latest images no
      # longer ship the -dev packages by default.
      - name: skia system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libfontconfig1-dev
      # The committed linux addon is replaced by this build, so the manifest no
      # longer describes the file on disk. `--allow-replaced` keeps the commit
      # and layout checks and skips the digest, which is the one thing a source
      # build is allowed to differ in. The `addon` job never builds, so it still
      # checks the committed digest.
      - name: linux addon from the renderer
        working-directory: vendor/flexlayer-render
        run: |
          npm ci
          npx napi build --platform --release
          cp flexlayer-render.linux-x64-gnu.node "$GITHUB_WORKSPACE/native/flexlayer-render/flexlayer-render.linux-x64-gnu.node"
      - name: the committed manifest still describes a release
        shell: bash
        run: node scripts/addon-hash.mjs --allow-replaced
      - run: npm ci
      - run: npm test
      - name: golden flip
        run: npx tsx scripts/check-golden.mjs
      - name: bench budget
        run: |
          npx tsx scripts/bench-3d.mjs --out bench-3d.json
          npx tsx scripts/check-budget.mjs bench-3d.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-3d
          path: bench-3d.json
          if-no-files-found: ignore

  addon:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 resolves to an unsupported configuration on this account;
        # macos-latest is the same arm64 image and is always available.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # A binary diffs as "Bin 20151488 -> ...", so a stray `subdir/b.node` once
      # sat in this repository for weeks. Anything that is not one of the three
      # release addons fails before the files are even loaded.
      - name: only the three release addons may carry a binary
        shell: bash
        run: node scripts/check-addon-history.mjs --range ${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.sha }}
      # This job never builds, so all three committed files must match
      # `BUILD.json` byte for byte. `addon-hash` loads the host one; the other
      # two are checked by digest only, which needs no loader.
      - name: the committed addons are the recorded ones
        shell: bash
        run: node scripts/addon-integrity.mjs
      - name: load the platform addon
        shell: bash
        run: node scripts/addon-hash.mjs

  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: resolve the renderer ref
        id: render-ref
        shell: bash
        env:
          RENDER_REF: ${{ vars.RENDER_REF }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/renderer-ref.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ruochi/flexlayer-render
          ref: ${{ steps.render-ref.outputs.ref }}
          token: ${{ secrets.RENDER_REPO_TOKEN }}
          path: vendor/flexlayer-render
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: skia system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libfontconfig1-dev
      - name: linux addon from the renderer
        working-directory: vendor/flexlayer-render
        run: |
          npm ci
          npx napi build --platform --release
          cp flexlayer-render.linux-x64-gnu.node "$GITHUB_WORKSPACE/native/flexlayer-render/flexlayer-render.linux-x64-gnu.node"
      - name: the committed manifest still describes a release
        shell: bash
        run: node scripts/addon-hash.mjs --allow-replaced
      - run: npm ci
      - name: gallery metrics
        run: npx tsx scripts/gallery-metrics.mjs --check
        env:
          # The manga hatch is compared against the legacy raster, which stays in
          # the private renderer repo so no retired output is published here.
          FLEXLAYER_LEGACY_REFERENCE: ${{ github.workspace }}/vendor/flexlayer-render/docs/quality/legacy-reference
      - name: animation metrics
        # Contact-edge jitter and flicker across the 3D animation set. These need
        # the real addon and only show up over a frame sequence, so they cannot
        # live in the unit suite.
        run: npx tsx scripts/anim-metrics.mjs --check
      - name: gallery sheets
        run: npm run gallery:3d
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-3d
          path: |
            docs/gallery/3d-*.png
            docs/gallery/3d/**/*.png
          if-no-files-found: ignore
